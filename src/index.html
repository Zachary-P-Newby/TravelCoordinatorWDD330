<!doctype html>
<html lang="en">
  <!--define language -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--set width for content-->
    <title>Travel Coordinator | Home</title>
    <link rel="stylesheet" href="./CSS/styles.css" />
    <script src="js/main.js" type="module"></script>
  </head>
  <body>
    <header></header>
    <main>
      <div class="main-sub-div">
        <div class="home-data-box" id="home-weather">
          <h2>Global Weather:</h2>
          <article>
            <form class="weather-search" onsubmit="event.preventDefault()">
              <label for="weather-search">Check Weather Around the Globe</label>
              <input
                name="weather-search"
                type="search"
                id="weather-searchbar"
                placeholder="Your Destination:"
              />
              <button id="weather-submit" type="submit">Go</button>
            </form>
          </article>
        </div>
        <div class="home-data-box" id="home-european-hotels">
          <h2>Hotels:</h2>

          <article id="european-hotels-data">
            <p class="home-data-box-link">
              <a href="/hotel-search/index.html">Find Hotels Across Europe</a>
            </p>
          </article>
        </div>
        <div class="home-data-box" id="home-flights-airports">
          <h2>Flights:</h2>
          <article>
            <p>Monitor Flights around the Globe</p>
            <p class="home-data-box-link">
              <a href="/flights/index.html">Check Flight Status</a>
            </p>
          </article>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
