<!doctype html>
<html lang="en">
  <!--define language -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--set width for content-->
    <title>Travel Coordinator | Home</title>
    <link rel="stylesheet" href="./CSS/styles.css" />
    <script src="js/main.js" type="module"></script>
  </head>
  <body>
    <header></header>
    <main>
      <div class="main-sub-div">
        <div class="home-data-box" id="home-destinations">
          <h2>Destinations</h2>
          <form id="desination-search">
            <label for="destination"></label>
            <input name="destination" type="search" />
            <button type="submit">Go</button>
          </form>
        </div>
        <div class="home-data-box" id="home-current-location">
          <h2>Current Location:</h2>

          <article id="current-location-data">
            <p><a href="./hotel-data/index.html">View Hotel Data</a></p>
          </article>
          <button id="current-location-button">Go</button>
        </div>
        <div class="home-data-box" id="home-flights-airports">
          <h2>Flights</h2>
          <form id="flight-search">
            <label for="location">Flight:</label>
            <input name="location" type="search" />
            <button type="submit" action>Go</button>
          </form>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
