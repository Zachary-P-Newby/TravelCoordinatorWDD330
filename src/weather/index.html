<!doctype html>
<html lang="en">
  <!--define language -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--set width for content-->
    <title>Travel Coordinator | Global Weather</title>
    <link rel="stylesheet" href="../CSS/styles.css" />
    <script src="../js/weather.js" type="module"></script>
  </head>
  <body>
    <header></header>
    <main>
      <h1>Global Weather:</h1>
      <div class="entity-data-display" id="weather-data-display">
        <div id="current-conditions-display"></div>
        <div id="new-location-div">
          <h2>New Location:</h2>
          <form class="weather-search" onsubmit="event.preventDefault()">
            <label for="city-name">City:</label>
            <input name="city-name" id="city-name" type="text" maxlength="50" />
            <button type="submit">Submit</button>
          </form>
          <p>Only Include the name of the city:</p>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
